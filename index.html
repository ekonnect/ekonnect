<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창고 택배 조회</title>
<meta name="theme-color" content="#0f1923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg: #0f1923; --bg2: #1a2535; --bg3: #1e2d40;
  --accent: #4fc3f7; --accent2: #81d4fa;
  --success: #66bb6a; --warning: #ffa726; --danger: #ef5350;
  --text: #e8f4fd; --text2: #90a4ae; --text3: #546e7a;
  --border: rgba(79,195,247,0.15); --border2: rgba(79,195,247,0.08);
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
.header { background: var(--bg); border-bottom: 1px solid var(--border2); padding: 14px 16px; position: sticky; top: 0; z-index: 100; }
.header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 6px var(--accent); flex-shrink: 0; }
.header h1 { font-size: 15px; font-weight: 700; } .header h1 span { color: var(--accent); }

/* Main */
.main { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }

/* Login */
.login-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; }
.login-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.login-card .sub { font-size: 12px; color: var(--text2); margin-bottom: 24px; }
.input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.input-row label { display: block; font-size: 10px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
.input-row input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; outline: none; transition: border-color 0.2s; }
.input-row input:focus { border-color: var(--accent); }
.input-row input::placeholder { color: var(--text3); font-size: 12px; font-family: 'Noto Sans KR', sans-serif; }
.btn-primary { width: 100%; background: var(--accent); color: #0f1923; border: none; border-radius: 8px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.5; }
.error-msg { background: rgba(239,83,80,0.1); border: 1px solid rgba(239,83,80,0.3); border-radius: 8px; padding: 9px 13px; font-size: 12px; color: #ef9a9a; margin-top: 12px; display: none; }
.error-msg.show { display: block; }

/* Dashboard */
.dashboard { display: none; }
.dashboard.show { display: block; }
.welcome-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.welcome-bar h2 { font-size: 16px; font-weight: 700; } .welcome-bar h2 span { color: var(--accent); }
.btn-logout { background: none; border: 1px solid var(--border); border-radius: 16px; padding: 5px 12px; color: var(--text2); font-size: 11px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.btn-logout:hover { border-color: var(--accent); color: var(--accent); }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; padding: 12px; text-align: center; }
.stat-card .num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; line-height: 1; margin-bottom: 3px; }
.stat-card .lbl { font-size: 10px; color: var(--text2); }
.stat-card.s-total .num { color: var(--accent); }
.stat-card.s-warn .num { color: var(--warning); }
.stat-card.s-done .num { color: var(--success); }

/* Filter tabs */
.filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.filter-tabs::-webkit-scrollbar { display: none; }
.tab-btn { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 5px 13px; font-size: 11px; font-weight: 500; color: var(--text2); cursor: pointer; white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; }
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #0f1923; }

/* Loading */
.loading { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Package list — compact table style */
.pkg-list { display: flex; flex-direction: column; gap: 6px; }

.pkg-row {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 11px 13px;
  display: grid;
  grid-template-columns: 20px 1fr auto;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
}
.pkg-row:hover { border-color: var(--border); background: var(--bg3); }
.pkg-row.selected { border-color: var(--accent); background: rgba(79,195,247,0.05); }
.pkg-row.status-overdue { border-left: 3px solid var(--danger); }
.pkg-row.status-expiring { border-left: 3px solid var(--warning); }
.pkg-row.status-shipped { border-left: 3px solid var(--success); opacity: 0.55; }

/* Checkbox */
.pkg-check { width: 16px; height: 16px; border: 1.5px solid var(--text3); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.pkg-row.selected .pkg-check { background: var(--accent); border-color: var(--accent); }
.pkg-check::after { content: ''; width: 8px; height: 5px; border-left: 2px solid #0f1923; border-bottom: 2px solid #0f1923; transform: rotate(-45deg) translateY(-1px); opacity: 0; }
.pkg-row.selected .pkg-check::after { opacity: 1; }

/* Row content */
.pkg-info { min-width: 0; }
.pkg-top-line { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.pkg-waybill { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--accent2); }
.pkg-company { font-size: 11px; color: var(--text3); }
.pkg-bottom-line { display: flex; gap: 12px; flex-wrap: wrap; }
.pkg-field { font-size: 11px; color: var(--text2); }
.pkg-field span { color: var(--text3); margin-right: 3px; }

.pkg-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.status-badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.3px; white-space: nowrap; }
.badge-stored { background: rgba(79,195,247,0.12); color: var(--accent); }
.badge-expiring { background: rgba(255,167,38,0.12); color: var(--warning); }
.badge-overdue { background: rgba(239,83,80,0.12); color: var(--danger); }
.badge-shipped { background: rgba(102,187,106,0.12); color: var(--success); }
.days-text { font-size: 10px; color: var(--text3); }
.days-text.urgent { color: var(--danger); font-weight: 600; }
.days-text.warn { color: var(--warning); }

/* Memo row */
.pkg-memo { font-size: 11px; color: var(--text3); margin-top: 3px; padding-top: 4px; border-top: 1px solid var(--border2); }

/* Select bar */
.select-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 12px 16px; display: none;
  z-index: 200;
}
.select-bar.show { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.select-bar-info { font-size: 13px; color: var(--text2); }
.select-bar-info strong { color: var(--accent); }
.btn-request { background: var(--accent); color: #0f1923; border: none; border-radius: 8px; padding: 10px 20px; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-cancel-sel { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text2); font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }

/* Empty */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-state .icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }
.empty-state p { font-size: 13px; }

/* ── Modal overlay ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 600px;
  padding: 24px 20px 40px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 20px; }

/* Selected packages mini list */
.selected-list { background: var(--bg3); border-radius: 8px; padding: 10px 13px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
.sel-item { display: flex; justify-content: space-between; align-items: center; }
.sel-item .waybill { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent2); }
.sel-item .co { font-size: 11px; color: var(--text3); }

/* Option buttons */
.option-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.option-btn {
  background: var(--bg3); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 14px 16px; cursor: pointer; text-align: left; transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif;
}
.option-btn:hover { border-color: var(--accent); background: rgba(79,195,247,0.05); }
.option-btn.selected-opt { border-color: var(--accent); background: rgba(79,195,247,0.08); }
.option-btn .opt-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.option-btn .opt-desc { font-size: 11px; color: var(--text2); }

/* Step indicator */
.step-indicator { display: flex; gap: 6px; margin-bottom: 20px; }
.step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.step-dot.active { background: var(--accent); }

.modal-btn-row { display: flex; gap: 10px; }
.btn-modal-back { flex: 1; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text2); font-size: 13px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.btn-modal-next { flex: 2; background: var(--accent); color: #0f1923; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.btn-modal-next:disabled { opacity: 0.4; cursor: not-allowed; }

/* CS 문의 완료 화면 */
.complete-screen { text-align: center; padding: 20px 0; }
.complete-icon { font-size: 40px; margin-bottom: 14px; }
.complete-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.complete-desc { font-size: 13px; color: var(--text2); line-height: 1.7; }
.btn-modal-close { width: 100%; background: var(--accent); color: #0f1923; border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; margin-top: 24px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo-dot"></div>
    <h1>창고 <span>택배</span> 조회</h1>
  </div>
</div>

<div class="main">

  <!-- 로그인 -->
  <div class="login-card" id="login-section">
    <h2>내 택배 확인하기</h2>
    <p class="sub">손님번호와 비밀번호를 입력하세요</p>
    <div class="input-group">
      <div class="input-row">
        <label>손님 번호</label>
        <input type="text" id="customer-id" placeholder="예: C001" autocomplete="off" autocapitalize="off">
      </div>
      <div class="input-row">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="관리자에게 받은 비밀번호">
      </div>
    </div>
    <button class="btn-primary" onclick="handleLogin()">조회하기</button>
    <div class="error-msg" id="error-msg">손님번호 또는 비밀번호가 올바르지 않습니다.</div>
  </div>

  <!-- 대시보드 -->
  <div class="dashboard" id="dashboard">
    <div class="welcome-bar">
      <h2>손님번호 <span id="display-id"></span></h2>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>
    <div class="stats-row">
      <div class="stat-card s-total"><div class="num" id="stat-total">—</div><div class="lbl">전체</div></div>
      <div class="stat-card s-warn"><div class="num" id="stat-expiring">—</div><div class="lbl">기한 임박</div></div>
      <div class="stat-card s-done"><div class="num" id="stat-shipped">—</div><div class="lbl">출고 완료</div></div>
    </div>
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterPackages('all',this)">전체</button>
      <button class="tab-btn" onclick="filterPackages('stored',this)">보관 중</button>
      <button class="tab-btn" onclick="filterPackages('expiring',this)">기한 임박</button>
      <button class="tab-btn" onclick="filterPackages('shipped',this)">출고 완료</button>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div>데이터를 불러오는 중...</div>
    <div class="pkg-list" id="pkg-list"></div>
  </div>
</div>

<!-- 출고 신청 하단 바 -->
<div class="select-bar" id="select-bar">
  <div class="select-bar-info"><strong id="sel-count">0</strong>개 선택됨</div>
  <div style="display:flex;gap:8px">
    <button class="btn-cancel-sel" onclick="clearSelection()">선택 취소</button>
    <button class="btn-request" onclick="openModal()">출고 신청</button>
  </div>
</div>

<!-- 출고 신청 모달 -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
// ★ 설정 영역 — 이 부분만 수정하세요
// ════════════════════════════════════════════

const SHEET_ID = '1538IIGx0Fx6dbrEzolXA26HiWH1e6gXcHTjZmCSAEbM';
const SHEET_NAME = '시트1';

const CUSTOMER_PASSWORDS = {
  '41': 'EK41A',
  '42': 'EK42B',
  '43': 'EK43C',
};

const COL = {
  EXPIRE_DATE:  0,
  ARRIVE_DATE:  1,
  SHIP_DATE:    2,
  CUSTOMER_ID:  3,
  COMPANY:      4,
  WAYBILL:      5,
  WEIGHT:       6,
  MEMO:         7,
};

// ════════════════════════════════════════════

let allPackages = [];
let selectedIds = new Set();
let modalStep = 1;
let selectedOption = '';

// ─── 로그인 ───
function handleLogin() {
  const id = document.getElementById('customer-id').value.trim().toUpperCase();
  const pw = document.getElementById('password').value.trim();
  const errEl = document.getElementById('error-msg');
  if (!id || !pw) { errEl.textContent = '손님번호와 비밀번호를 모두 입력하세요.'; errEl.classList.add('show'); return; }
  if (!CUSTOMER_PASSWORDS[id] || CUSTOMER_PASSWORDS[id] !== pw) { errEl.classList.add('show'); return; }
  errEl.classList.remove('show');
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('display-id').textContent = id;
  document.getElementById('dashboard').classList.add('show');
  loadPackages(id);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-section').style.display !== 'none') handleLogin();
});

function handleLogout() {
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('customer-id').value = '';
  document.getElementById('password').value = '';
  allPackages = []; selectedIds.clear(); updateSelectBar();
}

// ─── 데이터 로딩 ───
async function loadPackages(customerId) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('pkg-list').innerHTML = '';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    allPackages = [];
    for (const row of json.table.rows) {
      if (!row.c || !row.c[COL.CUSTOMER_ID] || !row.c[COL.CUSTOMER_ID].v) continue;
      if (String(row.c[COL.CUSTOMER_ID].v).trim().toUpperCase() !== customerId) continue;
      allPackages.push({
        id: allPackages.length,
        expireDate: getCellValue(row.c[COL.EXPIRE_DATE]),
        arriveDate: getCellValue(row.c[COL.ARRIVE_DATE]),
        shipDate:   getCellValue(row.c[COL.SHIP_DATE]),
        company:    getCellValue(row.c[COL.COMPANY]),
        waybill:    getCellValue(row.c[COL.WAYBILL]),
        weight:     getCellValue(row.c[COL.WEIGHT]),
        memo:       getCellValue(row.c[COL.MEMO]),
      });
    }
    document.getElementById('loading').style.display = 'none';
    updateStats(); renderPackages(allPackages);
  } catch(e) {
    document.getElementById('loading').innerHTML = '<p style="color:var(--danger);font-size:13px">⚠️ 데이터를 불러오지 못했습니다. SHEET_ID와 시트 공개 설정을 확인하세요.</p>';
  }
}

function getCellValue(cell) {
  if (!cell || cell.v === null || cell.v === undefined) return '';
  return String(cell.f || cell.v).trim();
}

function getDaysLeft(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr.replace(/\//g,'-')); if(isNaN(d)) return null;
  d.setHours(0,0,0,0);
  return Math.floor((d - today) / 86400000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── 통계 ───
function updateStats() {
  document.getElementById('stat-total').textContent = allPackages.length;
  document.getElementById('stat-shipped').textContent = allPackages.filter(p=>p.shipDate).length;
  document.getElementById('stat-expiring').textContent = allPackages.filter(p=>{
    const d = getDaysLeft(p.expireDate); return d !== null && d <= 3 && d >= 0 && !p.shipDate;
  }).length;
}

// ─── 필터 ───
function filterPackages(filter, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let list = allPackages;
  if (filter==='stored') list = allPackages.filter(p=>!p.shipDate);
  else if (filter==='shipped') list = allPackages.filter(p=>p.shipDate);
  else if (filter==='expiring') list = allPackages.filter(p=>{const d=getDaysLeft(p.expireDate);return d!==null&&d<=3&&d>=0&&!p.shipDate;});
  renderPackages(list);
}

// ─── 렌더링 ───
function renderPackages(packages) {
  const el = document.getElementById('pkg-list');
  if (!packages.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>해당하는 택배가 없습니다.</p></div>';
    return;
  }
  el.innerHTML = packages.map(p => {
    const daysLeft = getDaysLeft(p.expireDate);
    const isShipped = !!p.shipDate;
    const isOverdue = daysLeft !== null && daysLeft < 0 && !isShipped;
    const isExpiring = daysLeft !== null && daysLeft <= 3 && daysLeft >= 0 && !isShipped;
    const isSel = selectedIds.has(p.id);

    let statusClass = '';
    let badge = '<span class="status-badge badge-stored">보관 중</span>';
    let daysHtml = '';

    if (isShipped) {
      statusClass = 'status-shipped';
      badge = '<span class="status-badge badge-shipped">출고 완료</span>';
      daysHtml = `<span class="days-text">출고: ${escHtml(p.shipDate)}</span>`;
    } else if (isOverdue) {
      statusClass = 'status-overdue';
      badge = '<span class="status-badge badge-overdue">기한 초과</span>';
      daysHtml = `<span class="days-text urgent">${Math.abs(daysLeft)}일 초과</span>`;
    } else if (isExpiring) {
      statusClass = 'status-expiring';
      badge = '<span class="status-badge badge-expiring">기한 임박</span>';
      daysHtml = `<span class="days-text warn">${daysLeft}일 남음</span>`;
    } else if (daysLeft !== null) {
      daysHtml = `<span class="days-text">${daysLeft}일 남음</span>`;
    }

    const memoHtml = p.memo ? `<div class="pkg-memo">📝 ${escHtml(p.memo)}</div>` : '';
    const selClass = isSel ? 'selected' : '';

    return `
    <div class="pkg-row ${statusClass} ${selClass}" onclick="toggleSelect(${p.id})">
      <div class="pkg-check"></div>
      <div class="pkg-info">
        <div class="pkg-top-line">
          <span class="pkg-waybill">${escHtml(p.waybill||'—')}</span>
          <span class="pkg-company">${escHtml(p.company||'—')}</span>
        </div>
        <div class="pkg-bottom-line">
          <div class="pkg-field"><span>도착</span>${escHtml(p.arriveDate||'—')}</div>
          <div class="pkg-field"><span>기한</span>${escHtml(p.expireDate||'—')}</div>
          ${p.weight ? `<div class="pkg-field"><span>무게</span>${escHtml(p.weight)}kg</div>` : ''}
        </div>
        ${memoHtml}
      </div>
      <div class="pkg-right">
        ${badge}
        ${daysHtml}
      </div>
    </div>`;
  }).join('');
}

// ─── 선택 ───
function toggleSelect(id) {
  const pkg = allPackages.find(p => p.id === id);
  if (pkg && pkg.shipDate) return; // 출고 완료는 선택 불가
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  // 해당 row만 업데이트
  document.querySelectorAll('.pkg-row').forEach(row => {
    const rowId = parseInt(row.getAttribute('onclick').match(/\d+/)[0]);
    if (rowId === id) row.classList.toggle('selected', selectedIds.has(id));
  });
  updateSelectBar();
}

function clearSelection() {
  selectedIds.clear();
  document.querySelectorAll('.pkg-row').forEach(r => r.classList.remove('selected'));
  updateSelectBar();
}

function updateSelectBar() {
  const bar = document.getElementById('select-bar');
  document.getElementById('sel-count').textContent = selectedIds.size;
  bar.classList.toggle('show', selectedIds.size > 0);
}

// ─── 모달 ───
function openModal() {
  if (selectedIds.size === 0) return;
  modalStep = 1; selectedOption = '';
  renderModal();
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function renderModal() {
  const selected = allPackages.filter(p => selectedIds.has(p.id));
  const content = document.getElementById('modal-content');

  const selectedListHtml = `
    <div class="selected-list">
      ${selected.map(p => `
        <div class="sel-item">
          <span class="waybill">${escHtml(p.waybill||'—')}</span>
          <span class="co">${escHtml(p.company||'—')} ${p.weight?escHtml(p.weight)+'kg':''}</span>
        </div>`).join('')}
    </div>`;

  if (modalStep === 1) {
    content.innerHTML = `
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>
      <div class="modal-title">출고 방법을 선택하세요</div>
      <div class="modal-sub">${selected.length}개 택배 선택됨</div>
      ${selectedListHtml}
      <div class="option-list">
        <button class="option-btn ${selectedOption==='unbox'?'selected-opt':''}" onclick="selectOption('unbox')">
          <div class="opt-title">拆箱合并</div>
          <div class="opt-desc">박스를 열어 내용물을 합쳐서 출고</div>
        </button>
        <button class="option-btn ${selectedOption==='nobox'?'selected-opt':''}" onclick="selectOption('nobox')">
          <div class="opt-title">不拆箱合并</div>
          <div class="opt-desc">박스를 열지 않고 그대로 합쳐서 출고</div>
        </button>
        <button class="option-btn ${selectedOption==='cs'?'selected-opt':''}" onclick="selectOption('cs')">
          <div class="opt-title">추가 설정 CS 문의</div>
          <div class="opt-desc">특별 요청사항이 있는 경우 CS에 문의</div>
        </button>
      </div>
      <div class="modal-btn-row">
        <button class="btn-modal-back" onclick="closeModal()">취소</button>
        <button class="btn-modal-next" id="btn-next" onclick="goStep2()" ${selectedOption?'':'disabled'}>다음</button>
      </div>`;
  } else {
    const optionLabel = selectedOption==='unbox'?'拆箱合并':selectedOption==='nobox'?'不拆箱合并':'추가 설정 CS 문의';
    content.innerHTML = `
      <div class="step-indicator">
        <div class="step-dot"></div>
        <div class="step-dot active"></div>
      </div>
      <div class="complete-screen">
        <div class="complete-icon">✅</div>
        <div class="complete-title">신청이 접수되었습니다</div>
        <div class="complete-desc">
          선택하신 <strong style="color:var(--accent)">${selected.length}개</strong> 택배의<br>
          <strong style="color:var(--accent)">${optionLabel}</strong> 출고 신청이 완료되었습니다.<br><br>
          CS팀이 순차적으로 연락드릴 예정입니다.
        </div>
        <button class="btn-modal-close" onclick="closeModal(); clearSelection();">확인</button>
      </div>`;
  }
}

function selectOption(opt) {
  selectedOption = opt;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected-opt'));
  event.currentTarget.classList.add('selected-opt');
  document.getElementById('btn-next').disabled = false;
}

function goStep2() {
  if (!selectedOption) return;
  modalStep = 2;
  renderModal();
}
</script>
</body>
</html>
